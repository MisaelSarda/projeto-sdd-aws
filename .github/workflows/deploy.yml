name: CI/CD Pipeline - SDD, SonarQube & AWS Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # =========================================================================
  # ETAPA 1 & 2: Testes Automatizados e Scanner de Segurança (SonarCloud/SAST)
  # =========================================================================
  test-and-security:
    name: Testes Unitários e SAST (SonarQube)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código-fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para o SonarQube calcular histórico de blame

      - name: Configurar Ambiente Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Testes Unitários e Cobertura (Pytest)
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term

      # Scanner de segurança estática (SAST). Com 'sonar.qualitygate.wait=true'
      # no sonar-project.properties, este passo AGUARDA o Quality Gate e FALHA
      # a pipeline se ele reprovar — bloqueando o deploy de código inseguro.
      - name: Scanner de Segurança SonarCloud (SAST + Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # =========================================================================
  # ETAPA 3 & 4: Build da Imagem Docker e Deploy Automatizado na AWS EC2
  # =========================================================================
  build-and-deploy:
    name: Build Docker e Deploy na AWS EC2
    needs: test-and-security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sdd-api-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sdd-api-app:${{ github.sha }}

      - name: Deploy na AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Iniciando deploy na AWS EC2..."
            mkdir -p ~/app
            cd ~/app

            export DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/sdd-api-app:latest

            cat << 'COMPOSE' > docker-compose.yml
            services:
              api:
                image: ${DOCKER_IMAGE}
                container_name: sdd-api-service
                restart: always
                ports:
                  - "80:8000"
                environment:
                  - APP_ENV=production
                healthcheck:
                  test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
            COMPOSE

            docker compose pull
            docker compose down
            docker compose up -d

            sleep 5
            curl -f http://localhost/health || exit 1
            echo "Deploy finalizado com sucesso na porta 80 da AWS EC2!"