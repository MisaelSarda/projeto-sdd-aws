# Configuração do SonarQube / SonarCloud para análise estática de código (SAST)

# >>> AJUSTE ESTES DOIS VALORES com o que o SonarCloud mostrar ao criar o projeto <<<
sonar.organization=SUA_ORGANIZACAO_SONARCLOUD
sonar.projectKey=SUA_PROJECT_KEY_SONARCLOUD

sonar.projectName=Projeto SDD AWS API

# Definição dos diretórios de código e testes
sonar.sources=app
sonar.tests=tests

# Caminho do relatório de cobertura gerado pelo pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Codificação
sonar.sourceEncoding=UTF-8

# Exclusões de arquivos de infraestrutura e documentação da análise estática de lógica
sonar.exclusions=docs/**,docker-compose.yml,Dockerfile

# Faz a pipeline AGUARDAR o resultado do Quality Gate e FALHAR se ele reprovar.
# É isto que garante que código com vulnerabilidade não avance para o deploy.
sonar.qualitygate.wait=true
