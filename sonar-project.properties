# Configuração do SonarQube / SonarCloud para análise estática de código (SAST)
sonar.projectKey=projeto-sdd-aws
sonar.projectName=Projeto SDD AWS API

# Definição dos diretórios de código e testes
sonar.sources=app
sonar.tests=tests

# Caminho do relatório de cobertura gerado pelo pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Codificação
sonar.sourceEncoding=UTF-8

# Exclusões de arquivos de infraestrutura e documentação da análise estática de lógica
sonar.exclusions=docs/**,docker-compose.yml,Dockerfile
